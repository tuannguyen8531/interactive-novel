<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vn-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0e18"/>
      <stop offset="50%" stop-color="#14182e"/>
      <stop offset="100%" stop-color="#221238"/>
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="vn-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Book Pages Gradient -->
    <linearGradient id="vn-book" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>

    <!-- Radiant AI Core Star Gradient -->
    <linearGradient id="vn-star-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#fdf4ff"/>
      <stop offset="70%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Gold Accent Star Gradient -->
    <linearGradient id="vn-gold-star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="vn-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Squircle Backdrop -->
  <rect width="64" height="64" rx="16" fill="url(#vn-bg)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" fill="none" stroke="url(#vn-border)" stroke-width="1.5"/>

  <!-- Ambient Radiant Core Glow -->
  <circle cx="32" cy="28" r="15" fill="#818cf8" opacity="0.18" filter="url(#vn-glow)"/>

  <!-- Open Storybook Tome -->
  <!-- Left Page -->
  <path d="M 32 47 C 26 44, 16 42, 12 46 C 12 37, 13 30, 13 30 C 17 27, 26 29, 32 33 Z" 
        fill="url(#vn-book)" opacity="0.95"/>
  <path d="M 32 47 C 26 44.5, 17 43, 14 46 L 14 32 C 18 29.5, 26 31, 32 35 Z" 
        fill="#a5b4fc" opacity="0.35"/>

  <!-- Right Page -->
  <path d="M 32 47 C 38 44, 48 42, 52 46 C 52 37, 51 30, 51 30 C 47 27, 38 29, 32 33 Z" 
        fill="url(#vn-book)" opacity="0.95"/>
  <path d="M 32 47 C 38 44.5, 47 43, 50 46 L 50 32 C 46 29.5, 38 31, 32 35 Z" 
        fill="#f472b6" opacity="0.35"/>

  <!-- Spine Center Line -->
  <path d="M 32 33 L 32 49" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>

  <!-- Floating 4-Point AI Sparkle Star (Main Emblem) -->
  <path d="M 32 10 
           Q 32 23, 37.5 23 
           Q 32 23, 32 36 
           Q 32 23, 26.5 23 
           Q 32 23, 32 10 Z" 
        fill="url(#vn-star-core)" filter="url(#vn-glow)"/>

  <!-- Secondary Companion Star (Top Right) -->
  <path d="M 47 13 
           Q 47 18, 49.5 18 
           Q 47 18, 47 23 
           Q 47 18, 44.5 18 
           Q 47 18, 47 13 Z" 
        fill="url(#vn-gold-star)"/>

  <!-- Tiny Atmospheric Story Stardust -->
  <circle cx="17" cy="21" r="1.5" fill="#c084fc" opacity="0.9"/>
  <circle cx="49" cy="38" r="1.2" fill="#67e8f9" opacity="0.8"/>
</svg>
